<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乱闘ファイターズ</title>
<style>
:root{--bg:#1a1a2e;--panel:#16213e;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text-dim:#aab;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f0f0f5;--panel:#fff;--text:#222;--text-dim:#666;}}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100%;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;}
h1{color:var(--accent);text-shadow:2px 2px 0 #000;margin:16px 0 8px;text-align:center;}
.screen{width:100%;max-width:700px;padding:0 12px;text-align:center;}
.modeRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0;}
.modeBtn{background:var(--panel);border:2px solid var(--accent2);color:var(--text);padding:20px 24px;border-radius:12px;font-size:16px;cursor:pointer;min-width:150px;}
.modeBtn:hover{border-color:var(--accent);}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:16px 0;}
.charBtn{background:var(--panel);border:2px solid var(--accent2);border-radius:8px;color:var(--text);padding:10px 4px;cursor:pointer;font-size:13px;}
.charBtn.sel{border-color:var(--accent);background:var(--accent2);}
.swatch{width:24px;height:24px;border-radius:50%;margin:0 auto 4px;}
#startBtn{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:8px;}
#startBtn:disabled{opacity:.4;cursor:not-allowed;}
#gameScreen{display:none;width:100%;max-width:700px;padding:0 12px;}
#levelBar{display:flex;justify-content:center;gap:4px;margin:8px 0;flex-wrap:wrap;}
.lvDot{width:20px;height:20px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;border:1px solid #444;}
.lvDot.done{background:var(--accent);color:#fff;border-color:var(--accent);}
.lvDot.cur{background:#fff;color:#000;border-color:#fff;}
.barsWrap{display:flex;justify-content:space-between;gap:16px;margin:6px 0;}
.teamBars{flex:1;}
.fRow{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0;padding:2px 4px;border-radius:6px;cursor:default;}
.fRow.ctrl{background:rgba(233,69,96,0.2);border:1px solid var(--accent);}
.fRow.ko{opacity:.3;}
.fRow.pick{cursor:pointer;}
.fName{width:56px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fBarWrap{flex:1;height:12px;background:#333;border-radius:6px;overflow:hidden;}
.fBar{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);}
.fBar.enemy{background:linear-gradient(90deg,#e94560,#ff7676);}
canvas{width:100%;max-width:100%;background:var(--accent2);border-radius:8px;touch-action:none;display:block;}
#msg{text-align:center;min-height:28px;font-weight:bold;color:var(--accent);margin:6px 0;}
.controls{display:flex;justify-content:space-between;margin:10px 0;flex-wrap:wrap;gap:6px;}
.pad{display:flex;gap:6px;}
.padBtn{background:var(--panel);border:2px solid var(--accent2);color:var(--text);border-radius:8px;padding:12px 16px;font-size:14px;cursor:pointer;user-select:none;}
.padBtn:active{background:var(--accent);}
#again{display:none;margin:10px auto;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;}
p.hint{color:var(--text-dim);font-size:12px;text-align:center;}
</style>
</head>
<body>
<h1>🥊 乱闘ファイターズ</h1>

<div class="screen" id="modeScreen">
  <p>あそびかたを選んでください</p>
  <div class="modeRow">
    <button class="modeBtn" id="modeTournament">🏆<br>トーナメント<br><small>レベル1〜10</small></button>
    <button class="modeBtn" id="modeDoubles">⚔️<br>2vs2 ダブルス<br><small>同時にたたかう</small></button>
  </div>
</div>

<div class="screen" id="selectScreen" style="display:none;">
  <p id="selMsg"></p>
  <div class="roster" id="roster"></div>
  <button id="startBtn" disabled>対戦開始！</button>
</div>

<div id="gameScreen">
  <div id="levelBar"></div>
  <div class="barsWrap">
    <div class="teamBars" id="p1bars"></div>
    <div class="teamBars" id="p2bars"></div>
  </div>
  <canvas id="stage" width="640" height="300"></canvas>
  <div id="msg"></div>
  <button id="again"></button>
  <div class="controls">
    <div class="pad"><button class="padBtn" id="btnLeft">◀ 移動</button><button class="padBtn" id="btnRight">移動 ▶</button><button class="padBtn" id="btnSwitch" style="display:none;">🔄 交代</button></div>
    <div class="pad"><button class="padBtn" id="btnPunch">👊 パンチ</button><button class="padBtn" id="btnKick">🦵 キック</button><button class="padBtn" id="btnGuard">🛡 ガード</button><button class="padBtn" id="btnJump">⤴ ジャンプ</button></div>
  </div>
  <p class="hint">PC: ←→で移動 / ↑またはSpaceでジャンプ / Aパンチ / Sキック / Dガード / Wで交代（ダブルス時）</p>
</div>

<script>
const NAMES=["ワタル","タケル","マサヒロ","リョウ","ケンジ","ダイスケ","ヒロト","ソウタ","ユウキ","カズキ","シンジ","タカシ","ノブオ","ゴロウ","テツヤ","アキラ","ジュン","マコト","ヨシオ","リク"];
const COLORS=["#e94560","#4caf50","#2196f3","#ff9800","#9c27b0","#00bcd4","#ffeb3b","#795548","#607d8b","#f44336","#3f51b5","#8bc34a","#ff5722","#673ab7","#009688","#cddc39","#03a9f4","#e91e63","#ffc107","#9e9e9e"];
const MAX_LEVEL=10;
let mode='tournament', selected=[], playerIndex=-1, level=1;
function randHp(){ return Math.floor(100+Math.random()*51); }

let audioCtx=null;
function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function beep(freq,dur,type,vol,delay){
  try{
    ensureAudio();
    const t0=audioCtx.currentTime+(delay||0);
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type||'square'; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(vol||0.15,t0);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
const sndPunch=()=>beep(220,0.08,'square',0.18);
const sndKick=()=>beep(140,0.12,'sawtooth',0.2);
const sndGuard=()=>beep(600,0.05,'triangle',0.12);
const sndJump=()=>beep(500,0.08,'sine',0.1);
const sndSelect=()=>beep(440,0.05,'sine',0.1);
const sndSwitch=()=>beep(880,0.07,'sine',0.12);
const sndLevelClear=()=>{beep(660,0.1,'square',0.18,0);beep(880,0.15,'square',0.2,0.1);};
const sndWin=()=>{beep(523,0.12,'square',0.2,0);beep(659,0.12,'square',0.2,0.12);beep(784,0.18,'square',0.22,0.24);};
const sndLose=()=>{beep(300,0.2,'sawtooth',0.2,0);beep(220,0.25,'sawtooth',0.2,0.18);};

let bgmTimer=null, bgmStep=0;
const BGM_BASS=[110,110,131,110,98,110,131,147];
const BGM_LEAD=[220,262,220,196,220,262,294,262];
function startBGM(){
  stopBGM(); ensureAudio(); bgmStep=0;
  bgmTimer=setInterval(()=>{
    const i=bgmStep%BGM_BASS.length;
    beep(BGM_BASS[i],0.16,'triangle',0.05);
    beep(BGM_LEAD[i],0.14,'square',0.035);
    bgmStep++;
  },200);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

document.getElementById('modeTournament').onclick=()=>{sndSelect();enterSelect('tournament');};
document.getElementById('modeDoubles').onclick=()=>{sndSelect();enterSelect('doubles');};

function enterSelect(m){
  mode=m; selected=[];
  document.getElementById('modeScreen').style.display='none';
  document.getElementById('selectScreen').style.display='block';
  document.getElementById('selMsg').textContent = m==='tournament' ? '自分のキャラクターを1人選んでください' : '自分のチームのキャラクターを2人選んでください';
  document.querySelectorAll('.charBtn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('startBtn').disabled=true;
}

const rosterEl=document.getElementById('roster');
NAMES.forEach((name,i)=>{
  const b=document.createElement('div');
  b.className='charBtn'; b.dataset.i=i;
  b.innerHTML=`<div class="swatch" style="background:${COLORS[i]}"></div>${name}`;
  b.onclick=()=>{
    sndSelect();
    const max = mode==='tournament'?1:2;
    const idx=selected.indexOf(i);
    if(idx>-1){selected.splice(idx,1); b.classList.remove('sel');}
    else if(selected.length<max){
      if(max===1){ document.querySelectorAll('.charBtn').forEach(x=>x.classList.remove('sel')); selected=[i]; }
      else { selected.push(i); }
      b.classList.add('sel');
    }
    document.getElementById('startBtn').disabled = selected.length!==max;
  };
  rosterEl.appendChild(b);
});

document.getElementById('startBtn').onclick=()=>{
  ensureAudio();
  document.getElementById('selectScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  if(mode==='tournament'){ playerIndex=selected[0]; level=1; startLevel(); }
  else{ startDoubles(selected.slice()); }
};

function backToMode(){
  stopBGM();
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('modeScreen').style.display='block';
  document.getElementById('again').style.display='none';
  document.getElementById('levelBar').innerHTML='';
}

function pickRandomExcluding(excludeArr,count){
  const pool=NAMES.map((_,i)=>i).filter(i=>!excludeArr.includes(i));
  const res=[];
  for(let k=0;k<count;k++){ const j=Math.floor(Math.random()*pool.length); res.push(pool.splice(j,1)[0]); }
  return res;
}

function renderLevelBar(){
  const bar=document.getElementById('levelBar'); bar.innerHTML='';
  if(mode!=='tournament') return;
  for(let i=1;i<=MAX_LEVEL;i++){
    const d=document.createElement('div');
    d.className='lvDot'+(i<level?' done':(i===level?' cur':''));
    d.textContent=i; bar.appendChild(d);
  }
}

function startLevel(){
  renderLevelBar();
  document.getElementById('msg').textContent='';
  document.getElementById('again').style.display='none';
  const enemyIndex=pickRandomExcluding([playerIndex],1)[0];
  const enemyHpBonus=(level-1)*3;
  startFight(
    [{idx:playerIndex,hp:randHp()}],
    [{idx:enemyIndex,hp:randHp()+enemyHpBonus}],
    {
      p1Speed:8.2, enemySpeed:9.5+level*0.4, enemyAiInterval:Math.max(9,26-level*1.2),
      enemyAtkChance:Math.min(0.65,0.22+level*0.04), enemyGuardChance:Math.min(0.4,0.10+level*0.03),
      enemyDmgMul:1+(level-1)*0.03,
      onEnd:(result)=>{
        const msg=document.getElementById('msg'), again=document.getElementById('again');
        if(result==='lose'){ sndLose(); msg.textContent=`レベル${level}で敗退…`; again.textContent='はじめから挑戦する'; again.onclick=backToMode; }
        else if(level>=MAX_LEVEL){ sndWin(); msg.textContent=`🏆 全${MAX_LEVEL}レベル制覇！チャンピオンだ！`; again.textContent='もう一度挑戦する'; again.onclick=backToMode; }
        else{ sndLevelClear(); msg.textContent=`レベル${level}クリア！`; again.textContent=`レベル${level+1}へ進む`; again.onclick=()=>{level++;startLevel();}; }
        again.style.display='block';
      }
    }
  );
}

function startDoubles(playerIdxs){
  document.getElementById('msg').textContent='';
  document.getElementById('again').style.display='none';
  const enemyIdxs=pickRandomExcluding(playerIdxs,2);
  startFight(
    playerIdxs.map(idx=>({idx,hp:randHp()})),
    enemyIdxs.map(idx=>({idx,hp:randHp()})),
    {
      p1Speed:8.2,
      allySpeed:33.0, allyAiInterval:16, allyAtkChance:0.45, allyGuardChance:0.2,
      enemySpeed:33.4, enemyAiInterval:16, enemyAtkChance:0.5, enemyGuardChance:0.25, enemyDmgMul:1,
      onEnd:(result)=>{
        const msg=document.getElementById('msg'), again=document.getElementById('again');
        if(result==='win'){ sndWin(); msg.textContent='🎉 ダブルス勝利！'; } else { sndLose(); msg.textContent='敗北…相手チームの勝ち'; }
        again.textContent='モード選択にもどる';
        again.onclick=backToMode;
        again.style.display='block';
      }
    }
  );
}

function startFight(p1Defs,p2Defs,cfg){
  const canvas=document.getElementById('stage'), ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,groundY=H-40;
  const mk=(d,x,facing)=>({idx:d.idx,name:NAMES[d.idx],color:COLORS[d.idx],hp:d.hp,maxHp:d.hp,x,facing,guard:false,action:0,actTimer:0,_flash:0,aiTimer:Math.random()*10,hasHit:false,y:0,vy:0});
  const p1Team=p1Defs.map((d,i)=>mk(d,100+i*70,1));
  const p2Team=p2Defs.map((d,i)=>mk(d,W-100-i*70,-1));
  let controlled=0, gameOver=false;
  const switchBtn=document.getElementById('btnSwitch');
  switchBtn.style.display = p1Team.length>1 ? 'inline-block' : 'none';

  function nearestAlive(f,arr){ let best=null,bd=Infinity; arr.forEach(o=>{ if(o.hp>0){ const d=Math.abs(o.x-f.x); if(d<bd){bd=d;best=o;} } }); return best; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function doAction(f,type){ if(f.action===0 && !f.guard && !gameOver && f.hp>0){ f.action=type; f.actTimer=14; f.hasHit=false; } }
  function doJump(f){ if(f.y<=0 && !gameOver && f.hp>0){ f.vy=11; sndJump(); } }

  function switchControl(){
    sndSwitch();
    const aliveIdxs=p1Team.map((f,i)=>i).filter(i=>p1Team[i].hp>0);
    if(aliveIdxs.length<2) return;
    const cur=aliveIdxs.indexOf(controlled);
    controlled = aliveIdxs[(cur+1)%aliveIdxs.length];
    renderBars();
  }
  switchBtn.onclick=switchControl;

  function renderBarsFor(team,elId,isEnemy,isP1){
    const el=document.getElementById(elId); el.innerHTML='';
    team.forEach((f,i)=>{
      const row=document.createElement('div');
      row.className='fRow'+(f.hp<=0?' ko':'')+(isP1 && i===controlled?' ctrl':'')+(isP1&&team.length>1&&f.hp>0?' pick':'');
      const nm=document.createElement('div'); nm.className='fName'; nm.textContent=f.name; nm.style.color=f.color;
      const col=document.createElement('div'); col.style.flex='1';
      const hpNum=document.createElement('div'); hpNum.style.fontSize='10px'; hpNum.style.textAlign='right'; hpNum.style.color='var(--text-dim)';
      hpNum.textContent=Math.max(0,Math.round(f.hp))+' / '+f.maxHp;
      const bw=document.createElement('div'); bw.className='fBarWrap';
      const bar=document.createElement('div'); bar.className='fBar'+(isEnemy?' enemy':''); bar.style.width=Math.max(0,100*f.hp/f.maxHp)+'%';
      bw.appendChild(bar); col.appendChild(hpNum); col.appendChild(bw);
      row.appendChild(nm); row.appendChild(col);
      if(isP1 && team.length>1 && f.hp>0) row.onclick=()=>{ controlled=i; renderBars(); };
      el.appendChild(row);
    });
  }
  function renderBars(){ renderBarsFor(p1Team,'p1bars',false,true); renderBarsFor(p2Team,'p2bars',true,false); }

  let keys={};
  const kd=e=>{ keys[e.key]=true; if(e.key==='w'||e.key==='W') switchControl(); if(e.key==='ArrowUp'||e.key===' '){ e.preventDefault(); doJump(p1Team[controlled]); } };
  const ku=e=>keys[e.key]=false;
  window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
  const hold=(id,key)=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;});
    el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false;});
    el.addEventListener('mousedown',()=>keys[key]=true);
    el.addEventListener('mouseup',()=>keys[key]=false);
    el.addEventListener('mouseleave',()=>keys[key]=false);
  };
  hold('btnLeft','ArrowLeft'); hold('btnRight','ArrowRight'); hold('btnGuard','d');
  document.getElementById('btnPunch').onclick=()=>doAction(p1Team[controlled],1);
  document.getElementById('btnKick').onclick=()=>doAction(p1Team[controlled],2);
  document.getElementById('btnJump').onclick=()=>doJump(p1Team[controlled]);

  function runAI(f,opponents,speed,aiInterval,atkChance,guardChance){
    if(f.hp<=0) return;
    f.aiTimer--;
    if(f.aiTimer<=0){
      f.aiTimer=aiInterval+Math.random()*aiInterval*0.6;
      const t=nearestAlive(f,opponents);
      if(t){
        const d=Math.abs(f.x-t.x);
        if(d>90){ f.guard=false; f.x += (f.x<t.x?speed:-speed); }
        else if(Math.random()<atkChance){ f.guard=false; doAction(f,Math.random()<0.5?1:2); }
        else if(Math.random()<0.12){ f.guard=false; doJump(f); }
        else f.guard=Math.random()<guardChance;
      }
    }
    if(f.action===0 && Math.random()<0.02) f.guard=false;
    f.x=clamp(f.x,20,W-20);
    const t2=nearestAlive(f,opponents);
    if(t2) f.facing=f.x<t2.x?1:-1;
  }

  function tryHit(attacker,opponents,dmgMul){
    if(attacker.hp<=0) return;
    if(attacker.action>0 && !attacker.hasHit && attacker.actTimer<=10 && attacker.actTimer>=5){
      const target=nearestAlive(attacker,opponents);
      if(target && Math.abs(target.x-attacker.x)<95){
        if(target.y>0){
          // ジャンプ中は回避
        } else {
          const base=(attacker.action===1?7:11)*dmgMul;
          target.hp -= target.guard?Math.round(base*0.2):Math.round(base);
          target.hp=Math.max(0,target.hp); target._flash=6;
          attacker.hasHit=true;
          if(target.guard) sndGuard(); else if(attacker.action===1) sndPunch(); else sndKick();
        }
      }
    }
  }

  function tick(){
    if(gameOver) return;
    const cf=p1Team[controlled];
    if(cf.hp>0){
      if(keys['ArrowLeft']) cf.x-=cfg.p1Speed;
      if(keys['ArrowRight']) cf.x+=cfg.p1Speed;
      cf.guard=!!keys['d'] && cf.action===0;
      if(keys['a']) doAction(cf,1);
      if(keys['s']) doAction(cf,2);
      cf.x=clamp(cf.x,20,W-20);
      const t=nearestAlive(cf,p2Team); if(t) cf.facing=cf.x<t.x?1:-1;
    } else {
      const aliveIdxs=p1Team.map((f,i)=>i).filter(i=>p1Team[i].hp>0);
      if(aliveIdxs.length) controlled=aliveIdxs[0];
    }
    p1Team.forEach((f,i)=>{ if(i!==controlled && f.hp>0) runAI(f,p2Team, cfg.allySpeed||3.0, cfg.allyAiInterval||16, cfg.allyAtkChance||0.4, cfg.allyGuardChance||0.2); });
    p2Team.forEach(f=>runAI(f,p1Team, cfg.enemySpeed, cfg.enemyAiInterval, cfg.enemyAtkChance, cfg.enemyGuardChance));

    [...p1Team,...p2Team].forEach(f=>{ if(f.action>0){ f.actTimer--; if(f.actTimer<=0) f.action=0; } if(f.y>0||f.vy!==0){ f.y+=f.vy; f.vy-=0.6; if(f.y<=0){f.y=0; f.vy=0;} } });
    p1Team.forEach(a=>tryHit(a,p2Team,1));
    p2Team.forEach(a=>tryHit(a,p1Team,cfg.enemyDmgMul||1));

    renderBars();
    if(p1Team.every(f=>f.hp<=0)){ finish('lose'); return; }
    if(p2Team.every(f=>f.hp<=0)){ finish('win'); return; }
    draw();
    requestAnimationFrame(tick);
  }

  function drawFighter(f,isControlled){
    if(f.hp<=0) return;
    ctx.save();
    if(f._flash>0){ ctx.globalAlpha=0.5; f._flash--; }
    const gy=groundY-f.y;
    ctx.fillStyle=f.guard?'#888':f.color;
    let w=30,h=f.action===2?46:64;
    ctx.fillRect(f.x-w/2,gy-h,w,h);
    ctx.beginPath(); ctx.arc(f.x,gy-h-12,12,0,Math.PI*2); ctx.fill();
    if(f.action===1) ctx.fillRect(f.x+f.facing*18,gy-h+14,f.facing*24,7);
    if(f.action===2) ctx.fillRect(f.x+f.facing*8,gy-13,f.facing*32,9);
    ctx.restore();
    ctx.fillStyle=isControlled?'#fff':'#ccc'; ctx.font=(isControlled?'bold ':'')+'11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.name,f.x,gy-h-22);
    if(isControlled){ ctx.fillStyle='#fff'; ctx.fillText('▼',f.x,gy-h-34); }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0f3460'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1a1a3a'; ctx.fillRect(0,groundY,W,H-groundY);
    ctx.strokeStyle='#2a2a5a'; ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
    p1Team.forEach((f,i)=>drawFighter(f,i===controlled));
    p2Team.forEach(f=>drawFighter(f,false));
  }
  function finish(result){
    gameOver=true;
    stopBGM();
    window.removeEventListener('keydown',kd); window.removeEventListener('keyup',ku);
    cfg.onEnd(result);
  }

  renderBars(); draw(); startBGM();
  requestAnimationFrame(tick);
}
